{% extends 'default/base.html' %}

{% block content %}
    <h1>Register as {{ role }}</h1>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <p>
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <div class="error">{{ field.errors }}</div>
                {% endif %}
            </p>
        {% endfor %}
        <p><input type="submit" value="Register"></p>
    </form>

    <div>
        <span>Already registered?</span>
        <span><a href="{% url 'users:login' %}">Log in</a></span>
    </div>
{% endblock %}
